<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="theme-color" content="#14385c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💰%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d2430;--mute:#6b7380;--line:#e6e2d9;--head:#14385c;--acc:#1f6fb2;--in:#1b8a5a;--out:#c4412f}
@media(prefers-color-scheme:dark){:root{--bg:#10161d;--card:#18212b;--ink:#e8ecf1;--mute:#93a0ae;--line:#263240;--head:#0c2238;--acc:#4a9ce0;--in:#3fc58a;--out:#f07a68}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
main{max-width:30rem;margin:0 auto;min-height:100vh;padding-bottom:6rem}
header{background:var(--head);color:#fff;padding:calc(1.25rem + env(safe-area-inset-top)) 1.25rem 2.5rem;border-radius:0 0 1.5rem 1.5rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
h1{margin:0;font-size:1.4rem}
h3{margin:0 0 .6rem;font-size:1rem}
.total{margin-top:1.25rem}.total small{opacity:.75}.total strong{display:block;font-size:2.4rem;line-height:1.1}
button,select,input{font:inherit;color:inherit}
.btn{border:0;border-radius:.6rem;padding:.55rem .9rem;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
.btn.ghost{background:rgba(255,255,255,.16)}.btn.alt{background:var(--line);color:var(--ink)}.btn.ok{background:var(--in)}
.pad{padding:0 1.25rem}
.stats{display:flex;gap:.75rem;margin-top:-1.4rem}
.stat{flex:1;background:var(--card);border-radius:.8rem;padding:.8rem;border:1px solid var(--line);border-left:4px solid}
.stat small{color:var(--mute)}.stat b{display:block;font-size:1.1rem}
.stat.in{border-left-color:var(--in)}.stat.in b{color:var(--in)}.stat.out{border-left-color:var(--out)}.stat.out b{color:var(--out)}
.row{display:flex;justify-content:space-between;align-items:center;margin:1.25rem 0 .6rem}
.row h3{margin:0}
select,input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:.6rem;padding:.55rem}
select.sm{width:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:.8rem}
.cat{margin:.5rem 0}.cat div{display:flex;justify-content:space-between;font-size:.9rem}
.bar{height:.5rem;border-radius:1rem;background:var(--line);overflow:hidden;margin-top:.25rem}.bar i{display:block;height:100%;background:var(--out)}
.item{display:flex;justify-content:space-between;gap:.75rem;margin-bottom:.6rem}
