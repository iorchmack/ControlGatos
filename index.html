<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos PWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS para exportar a Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a"> <!-- Dark blue theme -->
    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-24">
        
        <!-- Header -->
        <header class="bg-blue-900 text-white p-6 rounded-b-3xl shadow-md">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-2xl font-bold">Mis Finanzas</h1>
                <button onclick="openExportModal()" class="bg-blue-800 hover:bg-blue-700 p-2 rounded-lg text-sm transition">
                    📊 Exportar
                </button>
            </div>
            <p class="text-blue-200 text-sm">Control local optimizado para GitHub Pages</p>
            <div class="mt-6">
                <p class="text-sm opacity-80">Saldo Total</p>
                <h2 class="text-4xl font-bold" id="totalBalance">$0.00</h2>
            </div>
        </header>

        <!-- Dashboard Cards -->
        <div class="flex justify-between px-6 -mt-6">
            <div class="bg-white rounded-xl shadow p-4 w-[48%] border-l-4 border-green-500">
                <p class="text-xs text-gray-500 font-semibold uppercase">Ingresos</p>
                <p class="text-lg font-bold text-green-600" id="totalIncome">+$0.00</p>
            </div>
            <div class="bg-white rounded-xl shadow p-4 w-[48%] border-l-4 border-red-500">
                <p class="text-xs text-gray-500 font-semibold uppercase">Gastos</p>
                <p class="text-lg font-bold text-red-600" id="totalExpense">-$0.00</p>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="p-6">
            <h3 class="text-gray-700 font-bold mb-4">Gastos por Categoría</h3>
            <div class="bg-white p-4 rounded-xl shadow border border-gray-100 relative h-48">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- Transactions List -->
        <div class="px-6 pb-6">
            <h3 class="text-gray-700 font-bold mb-4">Transacciones</h3>
            <div id="transactionList" class="space-y-3">
                <!-- Las transacciones se renderizan aquí -->
            </div>
        </div>

        <!-- FAB (Add Button) -->
        <button onclick="openTransactionModal()" class="fixed bottom-6 right-6 bg-blue-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-3xl hover:bg-blue-700 transition z-10">
            +
        </button>

        <!-- Transaction Modal -->
        <div id="transactionModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
            <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
                <h3 class="text-xl font-bold mb-4 text-blue-900" id="modalTitle">Nueva Transacción</h3>
                <form id="transactionForm" onsubmit="saveTransaction(event)">
                    <input type="hidden" id="transId">
                    
                    <div class="mb-4">
                        <label class="block text-sm text-gray-600 mb-1">Tipo</label>
                        <select id="transType" class="w-full border rounded-lg p-2 bg-gray-50">
                            <option value="expense">Gasto</option>
                            <option value="income">Ingreso</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm text-gray-600 mb-1">Monto ($)</label>
                        <input type="number" id="transAmount" step="0.01" required class="w-full border rounded-lg p-2 bg-gray-50">
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm text-gray-600 mb-1">Descripción</label>
                        <input type="text" id="transDesc" required class="w-full border rounded-lg p-2 bg-gray-50">
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm text-gray-600 mb-1">Categoría</label>
                        <input type="text" id="transCat" placeholder="Ej. Comida, Transporte, Salario" required class="w-full border rounded-lg p-2 bg-gray-50">
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-sm text-gray-600 mb-1">Fecha</label>
                        <input type="date" id="transDate" required class="w-full border rounded-lg p-2 bg-gray-50">
                    </div>

                    <div class="flex gap-3">
                        <button type="button" onclick="closeModal('transactionModal')" class="flex-1 bg-gray-200 text-gray-800 py-2 rounded-lg font-semibold">Cancelar</button>
                        <button type="submit" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-semibold">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Export Modal -->
        <div id="exportModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
            <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
                <h3 class="text-xl font-bold mb-4 text-blue-900">Exportar a Excel</h3>
                <div class="mb-4">
                    <label class="block text-sm text-gray-600 mb-1">Fecha Inicio</label>
                    <input type="date" id="exportStart" class="w-full border rounded-lg p-2 bg-gray-50">
                </div>
                <div class="mb-6">
                    <label class="block text-sm text-gray-600 mb-1">Fecha Fin</label>
                    <input type="date" id="exportEnd" class="w-full border rounded-lg p-2 bg-gray-50">
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="closeModal('exportModal')" class="flex-1 bg-gray-200 text-gray-800 py-2 rounded-lg font-semibold">Cancelar</button>
                    <button type="button" onclick="exportToExcel()" class="flex-1 bg-green-600 text-white py-2 rounded-lg font-semibold">Descargar Excel</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ESTADO DE LA APLICACIÓN (Guardado local para que funcione en Github Pages)
        let transactions = JSON.parse(localStorage.getItem('finanzas_data')) || [];
        let chartInstance = null;

        // INICIALIZACIÓN
        document.addEventListener('DOMContentLoaded', () => {
            // Set today's date by default
            document.getElementById('transDate').valueAsDate = new Date();
            updateUI();
        });

        // FUNCIONES DE UI
        function updateUI() {
            renderList();
            renderDashboard();
            updateChart();
            localStorage.setItem('finanzas_data', JSON.stringify(transactions));
        }

        function renderDashboard() {
            const income = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            const expense = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
            const balance = income - expense;

            document.getElementById('totalIncome').innerText = `+$${income.toFixed(2)}`;
            document.getElementById('totalExpense').innerText = `-$${expense.toFixed(2)}`;
            document.getElementById('totalBalance').innerText = `$${balance.toFixed(2)}`;
        }

        function renderList() {
            const listEl = document.getElementById('transactionList');
            listEl.innerHTML = '';

            if (transactions.length === 0) {
                listEl.innerHTML = '<p class="text-gray-400 text-center text-sm py-4">No hay registros. Comienza agregando uno.</p>';
                return;
            }

            // Ordenar por fecha descendente
            const sorted = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

            sorted.forEach(t => {
                const isIncome = t.type === 'income';
                const div = document.createElement('div');
                div.className = 'bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center';
                div.innerHTML = `
                    <div class="flex-1">
                        <p class="font-semibold text-gray-800">${t.desc}</p>
                        <p class="text-xs text-gray-500">${t.date} • ${t.category}</p>
                    </div>
                    <div class="text-right flex flex-col items-end">
                        <p class="font-bold ${isIncome ? 'text-green-600' : 'text-red-600'}">
                            ${isIncome ? '+' : '-'}$${t.amount.toFixed(2)}
                        </p>
                        <div class="flex gap-2 mt-1">
                            <button onclick="editTransaction(${t.id})" class="text-blue-500 text-xs">✏️</button>
                            <button onclick="deleteTransaction(${t.id})" class="text-red-500 text-xs">🗑️</button>
                        </div>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        // FUNCIONES DE CRUD
        function saveTransaction(e) {
            e.preventDefault();
            const idInput = document.getElementById('transId').value;
            
            const newTrans = {
                id: idInput ? parseInt(idInput) : Date.now(),
                type: document.getElementById('transType').value,
                amount: parseFloat(document.getElementById('transAmount').value),
                desc: document.getElementById('transDesc').value,
                category: document.getElementById('transCat').value,
                date: document.getElementById('transDate').value
            };

            if (idInput) {
                // Modificar existente
                const index = transactions.findIndex(t => t.id === newTrans.id);
                if (index > -1) transactions[index] = newTrans;
            } else {
                // Nuevo registro
                transactions.push(newTrans);
            }

            closeModal('transactionModal');
            updateUI();
        }

        function deleteTransaction(id) {
            if(confirm('¿Estás seguro de eliminar este registro?')) {
                transactions = transactions.filter(t => t.id !== id);
                updateUI();
            }
        }

        function editTransaction(id) {
            const t = transactions.find(x => x.id === id);
            if(!t) return;
            
            document.getElementById('modalTitle').innerText = 'Modificar Transacción';
            document.getElementById('transId').value = t.id;
            document.getElementById('transType').value = t.type;
            document.getElementById('transAmount').value = t.amount;
            document.getElementById('transDesc').value = t.desc;
            document.getElementById('transCat').value = t.category;
            document.getElementById('transDate').value = t.date;
            
            document.getElementById('transactionModal').classList.add('active');
        }

        // GRÁFICOS
        function updateChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            // Agrupar gastos por categoría
            const expenses = transactions.filter(t => t.type === 'expense');
            const catTotals = {};
            expenses.forEach(t => {
                catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
            });

            const labels = Object.keys(catTotals);
            const data = Object.values(catTotals);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.length ? labels : ['Sin datos'],
                    datasets: [{
                        data: data.length ? data : [1],
                        backgroundColor: labels.length ? ['#f87171', '#60a5fa', '#fbbf24', '#34d399', '#a78bfa'] : ['#e5e7eb']
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right' } }
                }
            });
        }

        // EXPORTAR A EXCEL (SheetJS)
        function exportToExcel() {
            const start = document.getElementById('exportStart').value;
            const end = document.getElementById('exportEnd').value;
            
            let filtered = transactions;
            
            if (start) filtered = filtered.filter(t => t.date >= start);
            if (end) filtered = filtered.filter(t => t.date <= end);

            if(filtered.length === 0) {
                alert('No hay datos en este rango de fechas para exportar.');
                return;
            }

            // Preparar datos para Excel
            const excelData = filtered.map(t => ({
                'Fecha': t.date,
                'Tipo': t.type === 'income' ? 'Ingreso' : 'Gasto',
                'Categoría': t.category,
                'Descripción': t.desc,
                'Monto': t.amount
            }));

            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Reporte_Gastos");
            
            // Generar nombre de archivo
            const filename = `Reporte_${start || 'Todo'}_al_${end || 'Todo'}.xlsx`;
            XLSX.writeFile(wb, filename);
            
            closeModal('exportModal');
        }

        // MODALES
        function openTransactionModal() {
            document.getElementById('transactionForm').reset();
            document.getElementById('transId').value = '';
            document.getElementById('modalTitle').innerText = 'Nueva Transacción';
            document.getElementById('transDate').valueAsDate = new Date();
            document.getElementById('transactionModal').classList.add('active');
        }

        function openExportModal() {
            document.getElementById('exportModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // SERVICE WORKER PARA GITHUB PAGES PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Se usa ruta relativa ./ para que funcione bajo subdirectorios de GH Pages
                navigator.serviceWorker.register('./sw.js')
                    .catch(error => console.log('Error en Service Worker:', error));
            });
        }
    </script>
</body>
</html>
